description: >-
  Wyndham Worldwide Corporation was a global hospitality holding company that
  offered hotel franchising, vacation ownership, and exchange services. On May
  31, 2018, it completed the spin-off of its hotel business as Wyndham Hotels &
  Resorts, Inc. (NYSE: WH) and the remaining vacation ownership and exchange
  business was renamed Wyndham Destinations, Inc. (NYSE: WYND), which was later
  renamed Travel + Leisure Co. (NYSE: TNL) on February 17, 2021. Wyndham
  Worldwide no longer exists as an operating entity.
